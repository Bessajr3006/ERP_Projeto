# Stack de produção para Portainer (via repositório Git) + Traefik
# Build local na VPS a partir do repositório — sem registry externo
# - App: erp.keystones.dev
# - phpMyAdmin: phpmyadmin.erp.keystones.dev

services:
  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      # Bootstrap do MariaDB
      MARIADB_DATABASE: ${MARIADB_DATABASE:-bessa_erp}
      MARIADB_USER: ${MARIADB_USER:-erp_app}
      # Credenciais obrigatórias via ambiente
      MARIADB_PASSWORD: ${MARIADB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      # Permite login do root via phpMyAdmin (apenas rede interna)
      MARIADB_ROOT_HOST: ${MARIADB_ROOT_HOST:-%}
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--mariadbupgrade"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s
    volumes:
      - mariadb:/var/lib/mysql
    networks:
      erp-internal:
        aliases:
          - db
          - mariadb

  backend:
    build:
      context: .
      dockerfile: Dockerfile.portainer
    image: ghcr.io/bessajr3006/erp-app:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      TZ: ${TZ:-America/Sao_Paulo}
      DATA_DIR: /data

      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-bessa_erp}
      DB_USER: ${DB_USER:-erp_app}
      DB_PASSWORD: ${DB_PASSWORD}

      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-24h}
      SALT_ROUNDS: ${SALT_ROUNDS:-10}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}

      MARIADB_DATABASE: ${MARIADB_DATABASE:-bessa_erp}
      MARIADB_USER: ${MARIADB_USER:-erp_app}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}

    volumes:
      - app_data:/data
    command: sh -c "node dist/scripts/initdb.js && npm start"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 30
      start_period: 360s
    networks:
      - erp-internal
    extra_hosts:
      - "srv-n1.netbird.cloud:100.112.188.194"
      - "srv-gelo.netbird.cloud:100.112.186.10"

  worker:
    build:
      context: .
      dockerfile: Dockerfile.portainer
    image: ghcr.io/bessajr3006/erp-app:latest
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    environment:
      NODE_ENV: production
      PORT: 3000
      TZ: ${TZ:-America/Sao_Paulo}
      DATA_DIR: /data

      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-bessa_erp}
      DB_USER: ${DB_USER:-erp_app}
      DB_PASSWORD: ${DB_PASSWORD}

      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-24h}
      SALT_ROUNDS: ${SALT_ROUNDS:-10}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}

      MARIADB_DATABASE: ${MARIADB_DATABASE:-bessa_erp}
      MARIADB_USER: ${MARIADB_USER:-erp_app}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}

    volumes:
      - app_data:/data
    command: npm run start:worker
    healthcheck:
      disable: true
    networks:
      - erp-internal
    extra_hosts:
      - "srv-n1.netbird.cloud:100.112.188.194"
      - "srv-gelo.netbird.cloud:100.112.186.10"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    image: ghcr.io/bessajr3006/erp-frontend:latest
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik
      - traefik.http.routers.erp-keystones.rule=Host(`erp.keystones.dev`)
      - traefik.http.routers.erp-keystones.entrypoints=websecure
      - traefik.http.routers.erp-keystones.tls=true
      - traefik.http.routers.erp-keystones.tls.certresolver=${TRAEFIK_CERTRESOLVER:-myresolver}
      - traefik.http.services.erp-keystones.loadbalancer.server.port=80
      # HTTP to HTTPS redirect
      - traefik.http.routers.erp-keystones-http.rule=Host(`erp.keystones.dev`)
      - traefik.http.routers.erp-keystones-http.entrypoints=web
      - traefik.http.routers.erp-keystones-http.middlewares=https-only@file
    networks:
      - erp-internal
      - traefik-public

  phpmyadmin:
    image: phpmyadmin:5-apache
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_ARBITRARY: 0
      UPLOAD_LIMIT: ${PHPMYADMIN_UPLOAD_LIMIT:-256M}
    # phpMyAdmin sem exposição pública Traefik. Acesso seguro via túnel SSH ou IP interno NetBird:
    # Túnel SSH: ssh -L 8082:127.0.0.1:8082 usuario@ip-vps
    # Acesso no navegador local: http://localhost:8082
    ports:
      - "127.0.0.1:8082:80"
    # labels:
    #   - traefik.enable=true
    #   - traefik.docker.network=traefik
    #   - traefik.http.routers.phpmyadmin-keystones.rule=Host(`phpmyadmin.erp.keystones.dev`)
    #   - traefik.http.routers.phpmyadmin-keystones.entrypoints=websecure
    #   - traefik.http.routers.phpmyadmin-keystones.tls=true
    #   - traefik.http.routers.phpmyadmin-keystones.tls.certresolver=${TRAEFIK_CERTRESOLVER:-myresolver}
    #   - traefik.http.services.phpmyadmin-keystones.loadbalancer.server.port=80
    networks:
      - erp-internal

volumes:
  mariadb:
    name: ${MARIADB_VOLUME_NAME:-projeto_erp_bessa_mariadb}

  # Volume único para dados do app (uploads + runtime). O entrypoint cria symlinks em /app/...
  app_data:
    name: ${APP_DATA_VOLUME_NAME:-projeto_erp_bessa_app_data}

networks:
  erp-internal:
    name: ${ERP_INTERNAL_NETWORK_NAME:-projeto_erp_bessa_internal}
    driver: bridge

  traefik-public:
    external: true
    name: ${TRAEFIK_PUBLIC_NETWORK_NAME:-traefik}
