<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>KEYSTONE - Visão Popular</title>
    <link href="/css/style.css?v=20261003220636" rel="stylesheet">
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="/img/icon-192x192-v3.png">
    
    <!-- Leaflet Assets -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <script src="/js/pwa.js?v=20261003220636"></script>
    <style>
        #map {
            height: 550px;
            width: 100%;
            border-radius: 12px;
        }
        .leaflet-container {
            font-family: inherit;
        }
    </style>
</head>
<body class="bg-gray-100 dark:bg-slate-900 text-gray-800 font-sans flex flex-col h-dvh overflow-hidden" data-required-module="mec-vision">
    <div id="app-navbar"></div>

    <main class="flex-1 min-h-0 overflow-y-auto w-full pt-4 pb-8 max-w-7xl mx-auto sm:px-6 lg:px-8">
        <div class="px-4 sm:px-0 space-y-6">
            <!-- Header block -->
            <div class="bg-white dark:bg-slate-800 shadow-sm rounded-xl border border-gray-200/50 dark:border-slate-700 px-6 py-4 flex flex-col md:flex-row md:items-center justify-between gap-4">
                <div>
                    <h1 class="text-xl font-bold text-gray-900 dark:text-gray-100 flex items-center gap-2.5">
                        🗺️ Visão Popular (Mapa Temático RJ)
                    </h1>
                    <p class="text-xs text-gray-500 dark:text-gray-400 mt-1">
                        Distribuição populacional e de renda per capita dos municípios do Rio de Janeiro.
                    </p>
                </div>
            </div>

            <!-- Split Layout -->
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                <!-- Map Card (Left) -->
                <div class="lg:col-span-2 bg-white dark:bg-slate-800 shadow-sm rounded-xl border border-gray-200/50 dark:border-slate-700 p-6 flex flex-col justify-between">
                    <div>
                        <div id="map" class="shadow-inner border border-gray-200 dark:border-slate-700"></div>
                        
                        <!-- Map Legend -->
                        <div class="mt-4 flex flex-wrap gap-4 text-xs font-semibold justify-center">
                            <div class="flex items-center gap-1.5">
                                <span class="w-3.5 h-3.5 rounded bg-emerald-500 inline-block border border-emerald-600"></span>
                                <span class="text-gray-600 dark:text-gray-400">Renda > R$ 1.500 & Pop. < 150.000</span>
                            </div>
                            <div class="flex items-center gap-1.5">
                                <span class="w-3.5 h-3.5 rounded bg-yellow-500 inline-block border border-yellow-600"></span>
                                <span class="text-gray-600 dark:text-gray-400">Renda > R$ 1.100 & Pop. < 400.000</span>
                            </div>
                            <div class="flex items-center gap-1.5">
                                <span class="w-3.5 h-3.5 rounded bg-rose-500 inline-block border border-rose-600"></span>
                                <span class="text-gray-600 dark:text-gray-400">Outros municípios</span>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- PNAD Contínua Statistics (Right) -->
                <div class="lg:col-span-1 space-y-6">
                    <!-- Historical Trend Card -->
                    <div class="bg-white dark:bg-slate-800 shadow-sm rounded-xl border border-gray-200/50 dark:border-slate-700 p-6 flex flex-col justify-between min-h-62.5">
                        <div>
                            <h2 class="text-sm font-bold text-gray-900 dark:text-gray-100 mb-3 flex items-center gap-1.5">
                                📈 Série Histórica PNAD (RJ)
                            </h2>
                            <div class="overflow-x-auto">
                                <table class="min-w-full divide-y divide-gray-100 dark:divide-slate-700">
                                    <thead>
                                        <tr class="text-left text-[10px] font-semibold text-gray-400 uppercase">
                                            <th class="pb-2">Ano</th>
                                            <th class="pb-2 text-right">Renda Média</th>
                                            <th class="pb-2 text-right">Desemprego</th>
                                        </tr>
                                    </thead>
                                    <tbody id="pnadTableBody" class="divide-y divide-gray-100 dark:divide-slate-700 text-xs text-gray-700 dark:text-gray-300">
                                        <!-- Will be populated dynamically -->
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>

                    <!-- Comparison Card (RJ vs SP/MG/DF) -->
                    <div class="bg-white dark:bg-slate-800 shadow-sm rounded-xl border border-gray-200/50 dark:border-slate-700 p-6">
                        <h2 class="text-sm font-bold text-gray-900 dark:text-gray-100 mb-3 flex items-center gap-1.5">
                            📊 Comparativo Estadual (2024)
                        </h2>
                        <div id="stateComparisonBody" class="space-y-3.5">
                            <!-- Will be populated dynamically -->
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="/js/api.js?v=20261003220636"></script>
    <script src="/js/popular-vision.js?v=20261003220636"></script>
    <script src="/js/components/navbar.js?v=20261003220636"></script>
    <div id="app-footer" class="shrink-0"></div>
    <script src="/js/components/footer.js?v=20261003220636"></script>
</body>
</html>
