<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>KEYSTONE - Rel.Valor_Empresa</title>
    <link href="/css/style.css?v=20261006100737" rel="stylesheet">
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="/img/icon-192x192-v3.png">
    <script src="/js/pwa.js?v=20261006100737"></script>
</head>
<body data-required-module="rel_valor_empresa" class="bg-gray-100 dark:bg-slate-900 min-h-screen text-gray-800 dark:text-gray-100 font-sans flex flex-col">
    <!-- Navbar Dinâmica -->
    <div id="app-navbar"></div>

    <main class="flex-1 w-full pt-4 pb-12 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <!-- ── HEADER & CONTROLS ────────────────────────────────────── -->
        <div class="mb-6 flex flex-col md:flex-row md:items-center justify-between gap-4">
            <div>
                <div class="flex items-center gap-2 mb-1">
                    <span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-md text-[11px] font-bold uppercase tracking-wider bg-emerald-100 text-emerald-800 dark:bg-emerald-950/60 dark:text-emerald-300 border border-emerald-200 dark:border-emerald-800/40">
                        <svg class="w-3 h-3 text-emerald-500" fill="currentColor" viewBox="0 0 20 20"><path d="M2 10a8 8 0 018-8v8h8a8 8 0 11-16 0z"/><path d="M12 2.252A8.014 8.014 0 0117.748 8H12V2.252z"/></svg>
                        Solidcon ERP
                    </span>
                    <span id="connectionBadge" class="text-xs text-gray-500 dark:text-gray-400 font-mono"></span>
                </div>
                <h1 class="text-2xl sm:text-3xl font-extrabold text-gray-900 dark:text-white tracking-tight flex items-center gap-2">
                    Rel.Valor_Empresa
                </h1>
                <p class="text-xs sm:text-sm text-gray-500 dark:text-gray-400 mt-0.5">
                    Relatório analítico de valores por empresa e filiais
                </p>
            </div>

            <!-- Status Indicator -->
            <div class="flex items-center gap-2 self-start md:self-auto">
                <div id="statusBadge" class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs font-semibold bg-gray-100 dark:bg-slate-800 text-gray-600 dark:text-gray-300 border border-gray-200 dark:border-slate-700">
                    <span class="w-2 h-2 rounded-full bg-emerald-500"></span>
                    <span>Pronto para consultar</span>
                </div>
            </div>
        </div>

        <!-- ── FILTER PANEL ─────────────────────────────────────────── -->
        <div class="bg-white dark:bg-slate-800/90 backdrop-blur-md rounded-2xl shadow-sm border border-gray-200/80 dark:border-slate-700/80 p-4 sm:p-5 mb-6">
            <form id="filterForm" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-7 gap-3.5 items-end">
                <!-- Empresa -->
                <div id="filterCompanyContainer">
                    <label for="filterCompany" class="block text-xs font-bold uppercase tracking-wider text-gray-600 dark:text-gray-400 mb-1.5">
                        Empresa (Grupo)
                    </label>
                    <select id="filterCompany" name="filterCompany" class="block w-full bg-gray-50 dark:bg-slate-900/70 text-gray-900 dark:text-gray-100 border border-gray-300 dark:border-slate-600 rounded-xl py-2 px-3 text-sm font-medium focus:ring-2 focus:ring-emerald-500/30 focus:border-emerald-500 transition-all">
                        <option value="">Carregando...</option>
                    </select>
                </div>

                <!-- Ano -->
                <div>
                    <label for="filterAno" class="block text-xs font-bold uppercase tracking-wider text-gray-600 dark:text-gray-400 mb-1.5">
                        Ano
                    </label>
                    <select id="filterAno" name="filterAno" class="block w-full bg-gray-50 dark:bg-slate-900/70 text-gray-900 dark:text-gray-100 border border-gray-300 dark:border-slate-600 rounded-xl py-2 px-3 text-sm font-semibold focus:ring-2 focus:ring-emerald-500/30 focus:border-emerald-500 transition-all">
                        <option value="2026">2026</option>
                        <option value="2025">2025</option>
                        <option value="2024">2024</option>
                        <option value="2023">2023</option>
                        <option value="2022">2022</option>
                    </select>
                </div>

                <!-- Mês -->
                <div>
                    <label for="filterMes" class="block text-xs font-bold uppercase tracking-wider text-gray-600 dark:text-gray-400 mb-1.5">
                        Mês
                    </label>
                    <select id="filterMes" name="filterMes" class="block w-full bg-gray-50 dark:bg-slate-900/70 text-gray-900 dark:text-gray-100 border border-gray-300 dark:border-slate-600 rounded-xl py-2 px-3 text-sm font-semibold focus:ring-2 focus:ring-emerald-500/30 focus:border-emerald-500 transition-all">
                        <option value="1">01 - Janeiro</option>
                        <option value="2">02 - Fevereiro</option>
                        <option value="3">03 - Março</option>
                        <option value="4">04 - Abril</option>
                        <option value="5">05 - Maio</option>
                        <option value="6">06 - Junho</option>
                        <option value="7">07 - Julho</option>
                        <option value="8">08 - Agosto</option>
                        <option value="9">09 - Setembro</option>
                        <option value="10">10 - Outubro</option>
                        <option value="11">11 - Novembro</option>
                        <option value="12">12 - Dezembro</option>
                    </select>
                </div>

                <!-- Filial -->
                <div>
                    <label for="filterFilial" class="block text-xs font-bold uppercase tracking-wider text-gray-600 dark:text-gray-400 mb-1.5">
                        Filial
                    </label>
                    <select id="filterFilial" name="filterFilial" class="block w-full bg-gray-50 dark:bg-slate-900/70 text-gray-900 dark:text-gray-100 border border-gray-300 dark:border-slate-600 rounded-xl py-2 px-3 text-sm font-medium focus:ring-2 focus:ring-emerald-500/30 focus:border-emerald-500 transition-all">
                        <option value="">Todas as Filiais</option>
                    </select>
                </div>

                <!-- Origem de Dados -->
                <div>
                    <label for="filterSource" class="block text-xs font-bold uppercase tracking-wider text-gray-600 dark:text-gray-400 mb-1.5">
                        Origem
                    </label>
                    <select id="filterSource" name="filterSource" class="block w-full bg-gray-50 dark:bg-slate-900/70 text-gray-900 dark:text-gray-100 border border-gray-300 dark:border-slate-600 rounded-xl py-2 px-3 text-sm font-medium focus:ring-2 focus:ring-emerald-500/30 focus:border-emerald-500 transition-all">
                        <option value="conta_baixa" selected>Baixas Financeiras</option>
                        <option value="banco_movimento">Extrato Bancário / Caixa</option>
                    </select>
                </div>

                <!-- Conexão Solidcon -->
                <div>
                    <label for="filterConnection" class="block text-xs font-bold uppercase tracking-wider text-gray-600 dark:text-gray-400 mb-1.5">
                        Conexão
                    </label>
                    <select id="filterConnection" name="filterConnection" class="block w-full bg-gray-50 dark:bg-slate-900/70 text-gray-900 dark:text-gray-100 border border-gray-300 dark:border-slate-600 rounded-xl py-2 px-3 text-sm font-medium focus:ring-2 focus:ring-emerald-500/30 focus:border-emerald-500 transition-all">
                        <option value="">Padrão da Empresa (Solidcon)</option>
                    </select>
                </div>

                <!-- Botão Consultar -->
                <div>
                    <button type="submit" id="btnFilterApply" class="w-full inline-flex items-center justify-center gap-2 px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl text-sm font-semibold shadow-sm hover:shadow transition-all focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:ring-offset-2 cursor-pointer">
                        <svg id="btnFilterIcon" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                        <span>Consultar</span>
                    </button>
                </div>
            </form>
        </div>

        <div id="alertMessage" class="hidden mb-6 p-4 rounded-xl text-sm"></div>
    </main>

    <!-- Scripts -->
    <script src="/js/api.js?v=20261006100737"></script>
    <script src="/js/rel_valor_empresa.js?v=20261006100737"></script>
    <script src="/js/components/navbar.js?v=20261006100737"></script>
    <div id="app-footer" class="shrink-0 mt-auto"></div>
    <script src="/js/components/footer.js?v=20261006100737"></script>
</body>
</html>
